name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0.0

      - name: Run Verification Test Suite
        run: |
          python test_dino_bot.py

      - name: Clean Build Workspace Prior to Packaging
        run: |
          powershell -ExecutionPolicy Bypass -File .\clean_workspace.ps1 -DeepClean

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller dino_bot.spec

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $exePath = "dist\dino_bot.exe"
          if (-not (Test-Path $exePath)) {
              throw "Binary dist\dino_bot.exe was not found after compilation!"
          }
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  dino_bot.exe" | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII
          Write-Host "SHA-256 Checksum: $hash"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Extract Tag or Release Title
        id: vars
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } elseif ($env:INPUT_TAG_NAME) {
              $tag = $env:INPUT_TAG_NAME
          } else {
              $tag = "v1.0.0"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Autonomous Chrome Dino Bot ${{ steps.vars.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/dino_bot.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
