name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests & Latency Benchmark
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax
        run: |
          python -m py_compile dino_bot.py test_dino_bot.py

      - name: Run Test Suite (19 Test Cases)
        run: |
          python test_dino_bot.py

      - name: Validate Telemetry Tuner CLI
        run: |
          python dino_bot.py --tune

      - name: Verify Clean Workspace Script
        run: |
          powershell -ExecutionPolicy Bypass -File .\clean_workspace.ps1
